version: 1
manual_extensions:
  - .go
  - .py
  - .ts
  - .tsx
  - .java
  - .proto
excluded:
  - docs/**/*.md
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.json"
  - "**/*.jsonl"
  - "**/*.sql"
exceptions:
  - path: tools/docs/**
    reason: Handwritten atlas-docs generators and validators count as production code.
    extensions: [.py, .go, .ts]
notes:
  - Markdown, YAML, JSON, SQL, and rendered operations files never count toward 560000.
  - Generated stubs such as .pb.go and _pb2.py are reported separately.
